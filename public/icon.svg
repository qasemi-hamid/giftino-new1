<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Premium matte invitation card background gradient (warm rich charcoal with subtle deep velvet violet/brown undertone) -->
    <linearGradient id="invitationBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181c" />
      <stop offset="40%" stop-color="#111113" />
      <stop offset="100%" stop-color="#08080a" />
    </linearGradient>

    <!-- Elegant soft champagne gold gradient for luxury borders -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e5ab" /> <!-- Pale gold -->
      <stop offset="30%" stop-color="#d4af37" /> <!-- Metallic gold -->
      <stop offset="70%" stop-color="#f5d77f" /> <!-- Bright champagne -->
      <stop offset="100%" stop-color="#aa7c11" /> <!-- Dark gold -->
    </linearGradient>

    <!-- Radial glow to create a premium card lighting effect behind the text -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0" />
    </radialGradient>
    
    <!-- Subtle drop shadow for the invitation frame to look layered -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Drop shadow for the central white typography to make it pop and look premium -->
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Squircle Base (iOS Home Screen App icon standard) -->
  <rect width="512" height="512" rx="115" fill="url(#invitationBg)" />

  <!-- Ambient Golden Center Glow -->
  <circle cx="256" cy="256" r="220" fill="url(#centerGlow)" />

  <!-- LUXURY INVITATION CARD FRAMEWORK (Art Deco / Minimalist Luxury) -->
  <!-- Outer Gold Frame -->
  <rect x="28" y="28" width="456" height="456" rx="92" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-opacity="0.65" />
  
  <!-- Inner Gold Frame (Subtle offset) -->
  <rect x="38" y="38" width="436" height="436" rx="84" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="6,4" />

  <!-- Elegant Decorative Corner Ornaments (Classic luxury invitation style) -->
  <!-- Top-Left -->
  <path d="M 50,50 L 70,50 M 50,50 L 50,70" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8" />
  <circle cx="78" cy="78" r="3" fill="url(#goldGrad)" />
  
  <!-- Top-Right -->
  <path d="M 462,50 L 442,50 M 462,50 L 462,70" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8" />
  <circle cx="434" cy="78" r="3" fill="url(#goldGrad)" />

  <!-- Bottom-Left -->
  <path d="M 50,462 L 70,462 M 50,462 L 50,442" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8" />
  <circle cx="78" cy="434" r="3" fill="url(#goldGrad)" />

  <!-- Bottom-Right -->
  <path d="M 462,462 L 442,462 M 462,462 L 462,442" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8" />
  <circle cx="434" cy="434" r="3" fill="url(#goldGrad)" />

  <!-- Premium Minimalist Invitation Seal/Ribbon Motif at the Bottom -->
  <path d="M 236,446 L 256,432 L 276,446 L 268,400 L 244,400 Z" fill="url(#goldGrad)" opacity="0.4" />
  <circle cx="256" cy="402" r="10" fill="url(#goldGrad)" filter="url(#cardShadow)" />

  <!-- Central Elegant White 'Go' Text (Bold, Chubby, perfectly centered with high-end screen readability) -->
  <text 
    x="256" 
    y="290" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Outfit', 'Space Grotesk', sans-serif" 
    font-size="160" 
    font-weight="900" 
    letter-spacing="-5" 
    fill="#ffffff" 
    text-anchor="middle"
    filter="url(#textShadow)"
  >Go</text>

  <!-- Tiny Persian subtitling below for elegant contrast 'گیفتی نو' in soft champagne gold -->
  <text 
    x="256" 
    y="348" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Vazirmatn', 'Yekan Bakh', sans-serif" 
    font-size="24" 
    font-weight="700" 
    letter-spacing="2"
    fill="url(#goldGrad)" 
    fill-opacity="0.9"
    text-anchor="middle"
  >G I F T I N O</text>
</svg>
